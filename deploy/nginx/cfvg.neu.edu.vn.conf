# SmartUni — https://cfvg.neu.edu.vn → Flask frontend :8027
# SSL wildcard NEU (cùng chứng chỉ các site *.neu.edu.vn trên máy này).

server {
    listen 80;
    listen [::]:80;
    server_name cfvg.neu.edu.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cfvg.neu.edu.vn;

    ssl_certificate         /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/mykey_web.pem;
    ssl_trusted_certificate /etc/nginx/ssl/chain_ca_web.pem;

    client_max_body_size 80m;

    location / {
        proxy_pass http://127.0.0.1:8027;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        keepalive_timeout 3600s;
    }
}
