<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ config.name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --blue: #00528c;
  --blue-dark: #003f6d;
  --navy: #08243b;
  --soft: #e8f2fa;
  --text: #1a2332;
  --muted: #5b6577;
  --border: #dfe5ee;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: #fff; overflow: hidden; }
button, input, select, textarea { font: inherit; }
a { color: var(--blue); }
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

.head { display: flex; align-items: center; gap: 10px; padding: 14px 12px 14px 16px; background: linear-gradient(135deg, var(--navy), var(--blue)); color: #fff; flex: none; }
.head .ava { width: 42px; height: 42px; border-radius: 50%; flex: none; background: #fff; padding: 2px; }
.head .ava svg { width: 100%; height: 100%; display: block; }
.head .meta { flex: 1; min-width: 0; }
.head .name { font-weight: 700; font-size: 15.5px; line-height: 1.2; }
.head .sub { font-size: 12px; color: rgba(255,255,255,.82); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.head .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 2px rgba(74,222,128,.3); }
.hbtn { width: 34px; height: 34px; border: 0; border-radius: 10px; background: transparent; color: #fff; cursor: pointer; display: grid; place-items: center; flex: none; }
.hbtn:hover { background: rgba(255,255,255,.16); }
.hbtn svg { width: 19px; height: 19px; }

.messages { flex: 1; overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 10px; background: #f5f7fb; min-height: 0; }
.row { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
.row.user { justify-content: flex-end; }
.row .mini { width: 28px; height: 28px; border-radius: 50%; flex: none; }
.row .mini svg { width: 100%; height: 100%; display: block; }
.row.cont .mini { visibility: hidden; }
.msg { max-width: 82%; padding: 10px 13px; border-radius: 16px; line-height: 1.55; font-size: 14px; word-wrap: break-word; }
.row.user .msg { background: var(--blue); color: #fff; border-bottom-right-radius: 5px; }
.row.bot .msg, .row.staff .msg { background: #fff; border: 1px solid var(--border); border-bottom-left-radius: 5px; }
.row.staff .msg { border-color: #9cc7e6; background: var(--soft); }
.msg .who { font-size: 11.5px; font-weight: 600; color: var(--blue); margin-bottom: 3px; }
.msg ul { margin: 6px 0 2px; padding-left: 18px; }
.msg li { margin: 3px 0; }
.msg p { margin: 0 0 6px; }
.msg p:last-child { margin-bottom: 0; }
.cite { display: inline-block; font-size: 10.5px; font-weight: 600; background: var(--soft); color: var(--blue); border-radius: 6px; padding: 0 5px; margin: 0 1px; vertical-align: 1px; }
.sources { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
.source { font-size: 11px; color: var(--muted); background: #f1f5f9; border-radius: 999px; padding: 2px 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.source.live { background: #e7f8f1; color: #0b7a55; }
.notice { align-self: center; font-size: 11.5px; color: var(--muted); background: #e9eef5; border-radius: 999px; padding: 3px 11px; }

.welcome { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.welcome .top { display: flex; gap: 10px; align-items: center; }
.welcome .top .ava { width: 44px; height: 44px; flex: none; }
.welcome .top .ava svg { width: 100%; height: 100%; display: block; }
.welcome b { color: var(--navy); }
.welcome p { margin: 0; font-size: 14px; line-height: 1.55; }
.suggest { display: flex; flex-direction: column; gap: 6px; }
.suggest button { text-align: left; border: 1px solid #cfe0ef; background: #f7fbff; color: var(--blue); border-radius: 10px; padding: 8px 11px; font-size: 13.5px; cursor: pointer; }
.suggest button:hover { background: var(--soft); }

.typing { display: none; }
.typing.on { display: flex; }
.typing .msg { display: flex; gap: 4px; padding: 13px 14px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: #9aa6b8; animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }

.chips { display: flex; gap: 7px; overflow-x: auto; padding: 8px 12px; background: #f5f7fb; scrollbar-width: none; flex: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid #b9d3e8; background: #fff; color: var(--blue); border-radius: 999px; padding: 6px 11px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.chip:hover { background: var(--soft); }

.composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); background: #fff; flex: none; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; max-height: 110px; min-height: 42px; outline: none; font-size: 14px; line-height: 1.4; background: #f8fafc; }
.composer textarea:focus { border-color: var(--blue); background: #fff; }
.send { width: 42px; height: 42px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; cursor: pointer; display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .45; cursor: default; }
.send svg { width: 19px; height: 19px; }
.foot { font-size: 10.5px; color: var(--muted); text-align: center; padding: 0 12px 8px; background: #fff; flex: none; }

.lead-card { background: #fff; border: 1px solid #b9d3e8; border-radius: 16px; padding: 14px; display: grid; gap: 8px; }
.lead-card h4 { margin: 0; font-size: 14.5px; color: var(--navy); }
.lead-card .hint { margin: -4px 0 0; font-size: 12.5px; color: var(--muted); }
.lead-card .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lead-card input:not([type=checkbox]), .lead-card select { width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; font-size: 13.5px; background: #fff; }
.lead-card label.check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.lead-card input[type=checkbox] { margin: 2px 0 0; flex: none; }
.lead-card .actions { display: flex; gap: 8px; justify-content: flex-end; }
.lead-card .btn { border: 0; border-radius: 9px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 13px; }
.lead-card .btn.primary { background: var(--blue); color: #fff; }
.lead-card .btn.ghost { background: transparent; color: var(--muted); }
.lead-card .error { color: #c62828; font-size: 12.5px; min-height: 1em; }
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div class="ava">{% include "public/_mascot.svg" %}</div>
    <div class="meta">
      <div class="name">{{ config.name }}</div>
      <div class="sub"><span class="dot"></span><span id="status-text">Thường trả lời ngay</span></div>
    </div>
    <button class="hbtn" type="button" id="btn-contact" title="Đăng ký nhận tư vấn" aria-label="Đăng ký nhận tư vấn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
    </button>
    <button class="hbtn" type="button" id="btn-new" title="Cuộc trò chuyện mới" aria-label="Cuộc trò chuyện mới">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="hbtn" type="button" id="btn-close" title="Thu nhỏ" aria-label="Thu nhỏ" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="messages" id="messages" aria-live="polite">
    <div class="row bot typing" id="typing"><div class="mini">{% include "public/_mascot.svg" %}</div><div class="msg"><i></i><i></i><i></i></div></div>
  </div>
  <div class="chips" id="chips"></div>
  <form class="composer" id="composer">
    <textarea id="input" rows="1" maxlength="1000" placeholder="Nhập câu hỏi..." aria-label="Câu hỏi"></textarea>
    <button class="send" id="send" type="submit" aria-label="Gửi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
    </button>
  </form>
  <div class="foot">Thông tin trích từ tài liệu tuyển sinh chính thức; câu hỏi khó sẽ được chuyển cho chuyên viên.</div>
</div>
<template id="mascot">{% include "public/_mascot.svg" %}</template>
<script>
(function () {
  const API = {{ api_base|tojson }};
  const CONFIG = {{ config|tojson }};
  const STORE_KEY = "smartuni_admission_session";
  const MASCOT = document.getElementById("mascot").innerHTML;
  const box = document.getElementById("messages");
  const typing = document.getElementById("typing");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const chips = document.getElementById("chips");
  const statusText = document.getElementById("status-text");
  const embedded = window.parent !== window;
  let session = "";
  let lastId = 0;
  let busy = false;
  let pollTimer = null;
  let leadShown = false;
  let leadDone = false;
  let lastRole = "";

  function notifyParent(type, extra) {
    if (embedded) window.parent.postMessage(Object.assign({ source: "smartuni-bot", type }, extra || {}), "*");
  }
  function storeGet() { try { return localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; } }
  function storeSet(v) { try { if (v) localStorage.setItem(STORE_KEY, v); else localStorage.removeItem(STORE_KEY); } catch (e) {} }
  function newSession() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "");
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function inline(s) {
    return s
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[(\d{1,2})\]/g, '<span class="cite">$1</span>')
      .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }
  function format(text) {
    let html = "";
    let inList = false;
    for (const raw of esc(text).split(/\n/)) {
      const line = raw.trim();
      const m = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
      if (m) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += "<li>" + inline(m[1]) + "</li>";
        continue;
      }
      if (inList) { html += "</ul>"; inList = false; }
      if (line) html += "<p>" + inline(line) + "</p>";
    }
    if (inList) html += "</ul>";
    return html;
  }
  function scrollDown() { box.scrollTop = box.scrollHeight; }
  function place(el) { box.insertBefore(el, typing); scrollDown(); }

  function addMessage(role, text, sources) {
    const kind = role === "user" ? "user" : role === "staff" ? "staff" : "bot";
    const row = document.createElement("div");
    row.className = "row " + kind + (kind !== "user" && lastRole === kind ? " cont" : "");
    let inner = "";
    if (kind === "staff") inner += '<div class="who">Chuyên viên tuyển sinh</div>';
    inner += kind === "user" ? "<p>" + esc(text).replace(/\n/g, "<br>") + "</p>" : format(text);
    if (sources && sources.length) {
      inner += '<div class="sources">' + sources.map(s => {
        const label = s.kind === "live" ? "Dữ liệu tuyển sinh hiện hành" : s.kind === "faq" ? "Hỏi đáp: " + (s.detail || s.title) : s.title;
        return '<span class="source' + (s.kind === "live" ? " live" : "") + '" title="' + esc(label) + '">' + esc(label) + "</span>";
      }).join("") + "</div>";
    }
    row.innerHTML = (kind === "user" ? "" : '<div class="mini">' + MASCOT + "</div>") + '<div class="msg">' + inner + "</div>";
    place(row);
    lastRole = kind;
    if (kind === "staff") notifyParent("staff-message");
    return row;
  }
  function addNotice(text) {
    const el = document.createElement("div");
    el.className = "notice";
    el.textContent = text;
    place(el);
    lastRole = "";
  }
  function welcome() {
    const card = document.createElement("div");
    card.className = "welcome";
    const qs = (CONFIG.quick_replies || []).slice(0, 4);
    card.innerHTML =
      '<div class="top"><div class="ava">' + MASCOT + '</div><p><b>' + esc(CONFIG.name) + "</b><br>" + esc(CONFIG.org_name || "") + "</p></div>" +
      "<p>" + esc(CONFIG.greeting) + "</p>" +
      (qs.length ? '<div class="suggest">' + qs.map(q => '<button type="button">' + esc(q) + "</button>").join("") + "</div>" : "");
    card.querySelectorAll(".suggest button").forEach(b => b.addEventListener("click", () => send(b.textContent)));
    place(card);
    lastRole = "";
  }
  function renderChips() {
    chips.innerHTML = "";
    (CONFIG.quick_replies || []).forEach(q => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = q;
      b.addEventListener("click", () => send(q));
      chips.appendChild(b);
    });
    chips.hidden = true;
  }
  function showChips() { chips.hidden = !chips.children.length; }
  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    typing.classList.toggle("on", v);
    if (v) scrollDown();
  }
  async function api(path, opts) {
    const res = await fetch(API + path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts || {}));
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.error || "Không kết nối được máy chủ, vui lòng thử lại.");
    return data;
  }
  function ensureSession() {
    if (!session) { session = newSession(); storeSet(session); }
  }

  async function send(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    ensureSession();
    showChips();
    addMessage("user", text);
    input.value = "";
    autoSize();
    setBusy(true);
    try {
      const data = await api("/chat", {
        method: "POST",
        body: JSON.stringify({ session, message: text, page_url: (embedded && document.referrer) || location.href }),
      });
      session = data.session || session;
      storeSet(session);
      if (data.message_id) lastId = Math.max(lastId, data.message_id);
      if (data.reply) addMessage("bot", data.reply, data.sources);
      setStatus(data.status);
      if (data.ask_contact && !leadShown && !leadDone) showLeadCard();
      startPolling();
    } catch (e) {
      addNotice(e.message);
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  function setStatus(st) {
    statusText.textContent = st === "human" ? "Chuyên viên đang hỗ trợ bạn" : "Thường trả lời ngay";
  }

  function showLeadCard() {
    leadShown = true;
    const card = document.createElement("form");
    card.className = "lead-card";
    const programs = (CONFIG.programs || []).map(p => '<option value="' + esc(p) + '">' + esc(p) + "</option>").join("");
    card.innerHTML =
      "<h4>Đăng ký nhận tư vấn</h4>" +
      '<p class="hint">Một chuyên viên tuyển sinh sẽ phụ trách và liên hệ riêng với bạn.</p>' +
      '<input name="full_name" placeholder="Họ và tên" autocomplete="name" required>' +
      '<div class="two"><input name="phone" placeholder="Số điện thoại" inputmode="tel" autocomplete="tel">' +
      '<input name="email" placeholder="Email" type="email" autocomplete="email"></div>' +
      '<div class="two"><select name="program"><option value="">Chương trình</option>' + programs + "</select>" +
      '<select name="contact_time"><option value="office">Giờ hành chính</option><option value="morning">Buổi sáng</option><option value="afternoon">Buổi chiều</option><option value="evening">Buổi tối</option><option value="weekend">Cuối tuần</option></select></div>' +
      '<label class="check"><input type="checkbox" name="consent"> Tôi đồng ý cho trung tâm dùng thông tin này để liên hệ tư vấn tuyển sinh.</label>' +
      '<div class="error"></div>' +
      '<div class="actions"><button type="button" class="btn ghost" data-close>Để sau</button><button type="submit" class="btn primary">Gửi đăng ký</button></div>';
    card.querySelector("[data-close]").addEventListener("click", () => { card.remove(); leadShown = false; });
    card.addEventListener("submit", async ev => {
      ev.preventDefault();
      const f = new FormData(card);
      const errEl = card.querySelector(".error");
      errEl.textContent = "";
      if (!f.get("phone") && !f.get("email")) { errEl.textContent = "Vui lòng nhập số điện thoại hoặc email."; return; }
      if (!f.get("consent")) { errEl.textContent = "Vui lòng đồng ý để trung tâm liên hệ."; return; }
      ensureSession();
      try {
        const data = await api("/contact", {
          method: "POST",
          body: JSON.stringify({
            session,
            full_name: f.get("full_name"),
            phone: f.get("phone"),
            email: f.get("email"),
            program: f.get("program"),
            contact_time: f.get("contact_time"),
            consent: !!f.get("consent"),
          }),
        });
        card.remove();
        leadDone = true;
        await syncMessages(false);
        startPolling();
      } catch (e) {
        errEl.textContent = e.message;
      }
    });
    place(card);
    lastRole = "";
    card.querySelector("input").focus();
  }

  async function syncMessages(staffOnly) {
    if (!session) return;
    try {
      const data = await api("/messages?session=" + encodeURIComponent(session) + "&after=" + lastId, { method: "GET" });
      for (const m of data.messages || []) {
        lastId = Math.max(lastId, m.id);
        if (!staffOnly || m.role === "staff") addMessage(m.role, m.content);
      }
      setStatus(data.status);
    } catch (e) {}
  }
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(() => { if (!busy) syncMessages(true); }, 4000);
  }
  function autoSize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 110) + "px";
  }
  async function restore() {
    session = storeGet();
    welcome();
    if (!session) return;
    try {
      const data = await api("/messages?session=" + encodeURIComponent(session) + "&after=0", { method: "GET" });
      const msgs = data.messages || [];
      if (!msgs.length) return;
      addNotice("Tiếp tục cuộc trò chuyện trước");
      showChips();
      for (const m of msgs) { lastId = Math.max(lastId, m.id); addMessage(m.role, m.content); }
      setStatus(data.status);
      startPolling();
    } catch (e) {}
  }

  document.getElementById("composer").addEventListener("submit", ev => { ev.preventDefault(); send(input.value); });
  input.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(input.value); } });
  input.addEventListener("input", autoSize);
  document.getElementById("btn-contact").addEventListener("click", () => { if (!leadShown) showLeadCard(); });
  document.getElementById("btn-new").addEventListener("click", () => {
    storeSet("");
    session = "";
    lastId = 0;
    leadShown = false;
    leadDone = false;
    lastRole = "";
    box.querySelectorAll(".row:not(.typing), .notice, .lead-card, .welcome").forEach(el => el.remove());
    chips.hidden = true;
    welcome();
    input.focus();
  });
  const closeBtn = document.getElementById("btn-close");
  if (embedded) {
    closeBtn.hidden = false;
    closeBtn.addEventListener("click", () => notifyParent("close"));
  }
  window.addEventListener("message", ev => {
    const d = ev.data;
    if (!d || d.source !== "smartuni-host") return;
    if (d.type === "focus") input.focus();
    if (d.type === "ask" && d.text) send(d.text);
    if (d.type === "contact" && !leadShown && !leadDone) showLeadCard();
  });
  renderChips();
  restore().then(() => notifyParent("ready"));
})();
</script>
</body>
</html>
