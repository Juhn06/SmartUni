<!DOCTYPE html>
<html lang="en">
<head>
    <title>List of User from Web API</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
</head>
<body>
    <h1>List of users</h1>
    <form method="POST">
        <table class="cart">
            <thead><tr>
                <th>id</th> <th>name</th> <th>email</th>
            </tr></thead>
    <tbody>
        {% for user in users %}
            <tr>
                <td>{{ user['id'] }}</td><td>{{ user['name'] }}</td><td>{{ user['email'] }}</td>
            </tr>
        {% endfor %}
    </tbody>
</body>
</html>
