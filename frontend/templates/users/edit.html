{% extends "base.html" %}

{% block title %}Edit User - DeployWeb{% endblock %}

{% block content %}
<h1 class="page-title">Edit User</h1>

<form class="form" method="POST" action="{{ url_for('edit', user_id=user.id) }}">
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ user.name }}" required autofocus>
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ user.email }}" required>
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" value="{{ user.password or '' }}" required>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Update User</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
