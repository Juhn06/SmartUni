{% extends "base.html" %}

{% block title %}Users - DeployWeb{% endblock %}

{% block content %}
<h1 class="page-title">Users</h1>

<div class="table-wrap">
    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td class="actions">
                    <a href="{{ url_for('edit', user_id=user.id) }}">Edit</a>
                    <a href="{{ url_for('delete', user_id=user.id) }}" class="delete-link" onclick="return confirm('Are you sure you want to delete this user? This cannot be undone.');">Delete</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" class="empty-cell">No users yet. <a href="{{ url_for('add') }}">Add one</a>.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
