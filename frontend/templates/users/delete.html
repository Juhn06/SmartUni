{% extends "base.html" %}

{% block title %}Delete User - DeployWeb{% endblock %}

{% block content %}
<h1 class="page-title">Delete User</h1>

<div class="card">
    <p>Are you sure you want to delete this user?</p>
    <p class="meta">ID: {{ user.id }}</p>
    <p class="meta">Name: {{ user.name }}</p>
    <p class="meta">Email: {{ user.email }}</p>
    <div class="card-actions">
        <form method="POST" action="{{ url_for('delete', user_id=user.id) }}" style="display: inline;">
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
        </form>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </div>
</div>
{% endblock %}
