{% extends "base.html" %}

{% block title %}Add Storage - DeployWeb{% endblock %}

{% block content %}
<h1 class="page-title">Add Storage</h1>

<form class="form form-wide" method="POST" action="{{ url_for('storages_add') }}">
    <div class="form-row">
        <div class="form-group">
            <label for="product">Product</label>
            <input type="text" id="product" name="product" value="{{ product or '' }}" required autofocus>
        </div>
        <div class="form-group">
            <label for="brand">Brand</label>
            <input type="text" id="brand" name="brand" value="{{ brand or '' }}">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label for="model">Model</label>
            <input type="text" id="model" name="model" value="{{ model or '' }}">
        </div>
        <div class="form-group">
            <label for="rating">Rating</label>
            <input type="text" id="rating" name="rating" value="{{ rating or '' }}" placeholder="e.g. 4.5">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label for="price">Price</label>
            <input type="text" id="price" name="price" value="{{ price or '' }}" placeholder="e.g. $99">
        </div>
        <div class="form-group">
            <label for="RAM">RAM</label>
            <input type="text" id="RAM" name="RAM" value="{{ RAM or '' }}" placeholder="e.g. 8GB">
        </div>
    </div>
    <div class="form-group">
        <label for="picture">Picture URL</label>
        <input type="url" id="picture" name="picture" value="{{ picture or '' }}" placeholder="https://...">
        <div id="picture-preview-wrap" class="form-picture-preview" style="display:{{ 'block' if picture else 'none' }}">
            <img id="picture-preview" src="{{ picture or '' }}" alt="Preview" onerror="this.style.display='none'">
        </div>
    </div>
    <div class="form-group">
        <label for="details">Details</label>
        <textarea id="details" name="details" rows="3">{{ details or '' }}</textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Add Storage</button>
        <a href="{{ url_for('storages_index') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
