{# Nút đề xuất — dùng trong .page-title-actions #}
{% if session.get('user') and feature_code and feature_code not in ('login', 'logout', 'signup', 'static', 'index') %}
<button type="button"
        class="btn btn-primary btn-sm btn-feature-feedback"
        id="open-feature-feedback"
        title="{{ t('suggest_title') }}"
        aria-label="{{ t('suggest_title') }}"
        data-code="{{ feature_code }}"
        data-path="{{ feature_path }}">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    <path d="M8 10h.01M12 10h.01M16 10h.01"/>
  </svg>
  <span class="btn-feature-feedback-label">{{ t('suggest') }}</span>
</button>
{% endif %}
